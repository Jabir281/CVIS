<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_206 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_206" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_206');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // CVIS Goal Perceptual Pipeline Simulator (Observe -> Understand -> Apply)
const width = container.clientWidth || 540;
const height = container.clientHeight || 380;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.set(0, 0, 75);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: 'low-power' });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setClearColor(0x000000, 0);
container.appendChild(renderer.domElement);

const rootGroup = new THREE.Group();
scene.add(rootGroup);

const primaryBlue = new THREE.Color(0x123F78);
const secondaryBlue = new THREE.Color(0x2864A5);
const paleBlue = new THREE.Color(0xA6C8E8);
const warmYellow = new THREE.Color(0xF2C94C);

const count = 1200;
const pGeometry = new THREE.BufferGeometry();
const positions = new Float32Array(count * 3);
const targetPositions = new Float32Array(count * 3);
const colors = new Float32Array(count * 3);

// Stage 0: 2D Sensor Sampling Plane
const stage0Pos = new Float32Array(count * 3);
const side = Math.floor(Math.sqrt(count));
for (let i = 0; i < count; i++) {
  const row = Math.floor(i / side) - (side / 2);
  const col = (i % side) - (side / 2);
  stage0Pos[i * 3] = col * 1.5 + (Math.random() - 0.5) * 0.4;
  stage0Pos[i * 3 + 1] = row * 1.5 + (Math.random() - 0.5) * 0.4;
  stage0Pos[i * 3 + 2] = (Math.sin(col * 0.2) * Math.cos(row * 0.2)) * 1.8;
}

// Stage 1: Volumetric Point Cloud
const stage1Pos = new Float32Array(count * 3);
for (let i = 0; i < count; i++) {
  const u = Math.random();
  const v = Math.random();
  const theta = u * 2.0 * Math.PI;
  const phi = Math.acos(2.0 * v - 1.0);
  const r = 18 + (Math.sin(theta * 3) * Math.cos(phi * 2) * 4);
  stage1Pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
  stage1Pos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta) * 0.85;
  stage1Pos[i * 3 + 2] = r * Math.cos(phi);
}

// Stage 2: Connected Coordinate Lattice
const stage2Pos = new Float32Array(count * 3);
for (let i = 0; i < count; i++) {
  const t = (i / count) * Math.PI * 12;
  const radius = 6 + (i / count) * 16;
  stage2Pos[i * 3] = Math.cos(t) * radius;
  stage2Pos[i * 3 + 1] = (i / count - 0.5) * 32;
  stage2Pos[i * 3 + 2] = Math.sin(t) * radius;
}

for (let i = 0; i < count * 3; i++) {
  positions[i] = stage0Pos[i];
  targetPositions[i] = stage0Pos[i];
}

for (let i = 0; i < count; i++) {
  let c = primaryBlue.clone().lerp(paleBlue, Math.random());
  if (Math.random() < 0.05) c = warmYellow;
  colors[i * 3] = c.r;
  colors[i * 3 + 1] = c.g;
  colors[i * 3 + 2] = c.b;
}

pGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
pGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const pMaterial = new THREE.PointsMaterial({
  size: 1.6,
  vertexColors: true,
  transparent: true,
  opacity: 0.88
});
const pointCloud = new THREE.Points(pGeometry, pMaterial);
rootGroup.add(pointCloud);

const cageGeo = new THREE.IcosahedronGeometry(17, 1);
const cageMat = new THREE.MeshBasicMaterial({
  color: 0x2864A5,
  wireframe: true,
  transparent: true,
  opacity: 0.0
});
const cageMesh = new THREE.Mesh(cageGeo, cageMat);
rootGroup.add(cageMesh);

const ringGeo = new THREE.RingGeometry(18, 18.5, 36);
const ringMat = new THREE.MeshBasicMaterial({
  color: 0xF2C94C,
  transparent: true,
  opacity: 0.35,
  side: THREE.DoubleSide
});
const reticleRing = new THREE.Mesh(ringGeo, ringMat);
rootGroup.add(reticleRing);

window.cvisSetGoalStage = function(stageIdx) {
  const targetSource = stageIdx === 0 ? stage0Pos : (stageIdx === 1 ? stage1Pos : stage2Pos);
  for (let i = 0; i < count * 3; i++) {
    targetPositions[i] = targetSource[i];
  }
  cageMat.opacity = stageIdx === 2 ? 0.35 : (stageIdx === 1 ? 0.12 : 0.0);
  reticleRing.material.opacity = stageIdx === 0 ? 0.6 : (stageIdx === 1 ? 0.25 : 0.45);
};

let isPaused = false;
window.cvisToggleGoalAnimation = function() {
  isPaused = !isPaused;
  return isPaused;
};

window.cvisResetGoalView = function() {
  rootGroup.rotation.set(0, 0, 0);
};

let clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  if (isPaused) return;

  const time = clock.getElapsedTime();
  rootGroup.rotation.y = time * 0.2;
  rootGroup.rotation.x = Math.sin(time * 0.15) * 0.08;

  const posArr = pGeometry.attributes.position.array;
  for (let i = 0; i < count * 3; i++) {
    posArr[i] += (targetPositions[i] - posArr[i]) * 0.06;
  }
  pGeometry.attributes.position.needsUpdate = true;

  reticleRing.rotation.z = time * 0.3;
  cageMesh.rotation.y = -time * 0.15;

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  const w = container.clientWidth || 540;
  const h = container.clientHeight || 380;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_206 -->
</body>
</html>
